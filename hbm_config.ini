[connectivity]
# A矩阵 (只读): 8个HBM通道
sp=SparseLUKernel_1.A_0:HBM[0]
sp=SparseLUKernel_1.A_1:HBM[1]
sp=SparseLUKernel_1.A_2:HBM[2]
sp=SparseLUKernel_1.A_3:HBM[3]
sp=SparseLUKernel_1.A_4:HBM[4]
sp=SparseLUKernel_1.A_5:HBM[5]
sp=SparseLUKernel_1.A_6:HBM[6]
sp=SparseLUKernel_1.A_7:HBM[7]

# L矩阵读写共享同一组8个m_axi端口
sp=SparseLUKernel_1.L_0:HBM[8]
sp=SparseLUKernel_1.L_1:HBM[9]
sp=SparseLUKernel_1.L_2:HBM[10]
sp=SparseLUKernel_1.L_3:HBM[11]
sp=SparseLUKernel_1.L_4:HBM[12]
sp=SparseLUKernel_1.L_5:HBM[13]
sp=SparseLUKernel_1.L_6:HBM[14]
sp=SparseLUKernel_1.L_7:HBM[15]

# U矩阵读写使用8个独立m_axi/HBM通道
sp=SparseLUKernel_1.U_0:HBM[16]
sp=SparseLUKernel_1.U_1:HBM[17]
sp=SparseLUKernel_1.U_2:HBM[18]
sp=SparseLUKernel_1.U_3:HBM[19]
sp=SparseLUKernel_1.U_4:HBM[20]
sp=SparseLUKernel_1.U_5:HBM[21]
sp=SparseLUKernel_1.U_6:HBM[22]
sp=SparseLUKernel_1.U_7:HBM[23]

# META数据 (只读)：按论文架构将度数/触发调度、列前端描述读取和
# segment/DepEntry解析分离到三个独立通道，避免中央scheduler串行仲裁。
sp=SparseLUKernel_1.META_SCHED_mmap:HBM[24]
sp=SparseLUKernel_1.META_FRONT_mmap:HBM[25]
sp=SparseLUKernel_1.META_SEGMENT_mmap:HBM[26]
